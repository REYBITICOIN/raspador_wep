services:
  api:
    build: ./services/api
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  dashboard:
    build: ./apps/dashboard
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "127.0.0.1:4173:4173"
    depends_on:
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
